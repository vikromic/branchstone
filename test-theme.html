<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Test</title>
  <link rel="stylesheet" href="docs/css/tokens.css">
  <style>
    body {
      padding: 20px;
      font-family: system-ui;
    }
    .status {
      margin: 20px 0;
      padding: 20px;
      border: 2px solid var(--border-default);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body data-theme="light">
  <h1>Theme Toggle Test</h1>

  <div class="status" id="status">
    <p>Current theme: <strong id="current-theme">light</strong></p>
    <p>Body data-theme: <strong id="body-theme">-</strong></p>
    <p>Stored theme: <strong id="stored-theme">-</strong></p>
  </div>

  <button id="toggle-btn">Toggle Theme</button>
  <button id="check-btn">Check Status</button>

  <script type="module">
    import { THEME, STORAGE_KEYS } from './docs/js/constants.js';
    import * as storage from './docs/js/storage.js';

    const updateStatus = () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const storedTheme = storage.getItem(STORAGE_KEYS.THEME);

      document.getElementById('current-theme').textContent = currentTheme;
      document.getElementById('body-theme').textContent = currentTheme || 'not set';
      document.getElementById('stored-theme').textContent = storedTheme || 'not set';

      console.log('Theme status:', {
        currentTheme,
        storedTheme,
        THEME,
        STORAGE_KEYS
      });
    };

    const toggleTheme = () => {
      const currentTheme = document.body.getAttribute('data-theme') || THEME.LIGHT;
      const newTheme = currentTheme === THEME.DARK ? THEME.LIGHT : THEME.DARK;

      console.log('Toggling theme from', currentTheme, 'to', newTheme);

      document.body.setAttribute('data-theme', newTheme);
      storage.setItem(STORAGE_KEYS.THEME, newTheme);

      updateStatus();
    };

    document.getElementById('toggle-btn').addEventListener('click', toggleTheme);
    document.getElementById('check-btn').addEventListener('click', updateStatus);

    // Initial status
    updateStatus();
  </script>
</body>
</html>
