<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Branchstone Art</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
    }
    .error-page__code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: var(--font-light);
      color: var(--accent-primary);
      line-height: 1;
      margin-bottom: var(--space-4);
    }
    .error-page__title {
      font-family: var(--font-display);
      font-size: var(--text-display-md);
      margin-bottom: var(--space-4);
    }
    .error-page__description {
      color: var(--text-secondary);
      max-width: 40ch;
      margin-bottom: var(--space-8);
    }
  </style>
</head>
<body data-theme="light">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="error-page">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">Page Not Found</h1>
    <p class="error-page__description">
      The page you're looking for has wandered off into the forest. Let's get you back on track.
    </p>
    <div>
      <a href="index.html" class="btn btn--primary">Return Home</a>
      <a href="gallery.html" class="btn btn--secondary">View Gallery</a>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
